<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzzy Weather</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
    </div>
    <div class="container">
        <header>
            <div class="search-box">
                <input type="text" id="citySearch" placeholder="Поиск города...">
                <button id="searchBtn">🔍</button>
                <div id="searchResults" class="search-results hidden"></div>
            </div>
            <h1 id="locationName">Sydney, Australia</h1>
            <div class="header-controls">
                <div class="lang-toggle" id="langToggle">
                    <span data-lang="en">EN</span>
                    <span data-lang="ru" class="active">RU</span>
                </div>
                <div class="units-toggle" id="unitsToggle">
                    <span data-unit="c" class="active">°C</span>
                    <span data-unit="f">°F</span>
                </div>
            </div>
        </header>

        <main>
            <section class="current-weather-card">
                <div class="card-header">
                    <span data-i18n="rightNow">Right now</span>
                    <button class="refresh-btn">🔄</button>
                </div>
                <div class="weather-main">
                    <div id="currentIcon" class="weather-icon">☁️</div>
                    <div class="temp-display">
                        <span id="currentTemp">12</span><span class="unit">°C</span>
                    </div>
                    <p id="currentDesc">Partly cloudy</p>
                </div>
                <div class="weather-details">
                    <div class="detail-item">
                        <span class="label" data-i18n="rain">Rain</span>
                        <span id="currentRain" class="value">0 mm</span>
                    </div>
                    <div class="detail-item">
                        <span class="label" data-i18n="humidity">Humidity</span>
                        <span id="currentHumidity" class="value">85 %</span>
                    </div>
                    <div class="detail-item">
                        <span class="label" data-i18n="wind">Wind</span>
                        <span id="currentWind" class="value">8.1 km/h</span>
                        <span id="windDir" class="sub-value">→ W</span>
                    </div>
                </div>
            </section>

            <section class="hourly-forecast-card">
                <div class="card-header">
                    <span data-i18n="hourlyForecast">Hourly forecast</span>
                    <div class="header-right">
                        <span data-i18n="next48Hours">Next 48 hours</span>
                        <button class="refresh-btn">🔄</button>
                    </div>
                </div>
                <div class="hourly-grid" id="hourlyGrid">
                    <!-- Будет заполнено JS -->
                </div>
            </section>

            <section class="daily-forecast-card">
                <div class="card-header">
                    <span data-i18n="dailyForecast">7-day forecast</span>
                    <div class="header-right">
                        <span data-i18n="dailyHighLow">Daily high and low</span>
                        <button class="refresh-btn">🔄</button>
                    </div>
                </div>
                <div class="daily-grid" id="dailyGrid">
                    <!-- Будет заполнено JS -->
                </div>
            </section>
        </main>

        <footer>
            <p data-i18n="footerText">Copyright 2026 Buzzy. Simple weather dashboard for selected cities.</p>
            <p><span data-i18n="dataProvidedBy">Weather forecast data provided by</span> <a href="https://open-meteo.com/" target="_blank">Open-Meteo</a>.</p>
        </footer>
    </div>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
